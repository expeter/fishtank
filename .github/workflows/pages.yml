name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check phone labels, controls and rotation
        run: npm run test:e2e -- tests/button-labels.spec.ts tests/quiet-ui.spec.ts tests/rotation.spec.ts tests/fish-colours.spec.ts tests/polish.spec.ts --workers=1
        env:
          FT_PRODUCTION: "1"
      - name: Keep browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: test-results
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
